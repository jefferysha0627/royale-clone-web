<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>分享圖產生器（開發用）</title>
    <style>
      html, body { margin: 0; background: #0b1117; font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: #f4efe4; }
      #og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(90% 120% at 15% 10%, #2a4560 0%, #16212c 55%, #0e161d 100%); }
      #og .text { position: absolute; left: 72px; top: 92px; width: 640px; }
      #og h1 { margin: 0; font-size: 94px; font-weight: 900; letter-spacing: 4px; line-height: 1.05; text-shadow: 0 6px 0 #070b0f; }
      #og .tag { margin: 22px 0 0; font-size: 46px; font-weight: 800; color: #f2b233; }
      #og .sub { margin: 18px 0 0; font-size: 30px; color: #c7d1da; }
      #og .chips { display: flex; gap: 14px; margin-top: 34px; }
      #og .chip { padding: 10px 22px; border-radius: 30px; border: 2px solid #3f5a73; font-size: 26px; font-weight: 700; background: rgba(0,0,0,.25); }
      #og .arena { position: absolute; right: 64px; top: 30px; width: 320px; height: 570px; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.6); border: 4px solid #0a0f14; }
      #og .cards { position: absolute; right: 410px; bottom: 44px; display: flex; gap: 12px; }
      #og .card { --c: #555; width: 92px; height: 115px; position: relative; border-radius: 12px; border: 3px solid rgba(255,255,255,.6); background: var(--c); box-shadow: 0 6px 0 rgba(0,0,0,.45); }
      #og .card .card-art { position: absolute; inset: 10% 10% 12% 10%; display: flex; }
      #og .card .card-art svg { width: 100%; height: 100%; }
      #og .card .cost { position: absolute; top: -10px; left: -10px; width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: radial-gradient(circle at 35% 35%, #d9b3ff, #a35cff 60%, #5e2aa3); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; }
      #og .card .cost b { transform: rotate(45deg); font-size: 18px; font-weight: 900; }
      #og .card .card-name, #og .card .fill { display: none; }
      #icon { width: 180px; height: 180px; }
    </style>
  </head>
  <body>
    <div id="og">
      <div class="text">
        <h1>皇室戰爭克隆</h1>
        <p class="tag">出牌派兵・過橋推塔</p>
        <p class="sub">三分鐘一局，手機點開就能玩</p>
        <div class="chips"><span class="chip">單人對電腦</span><span class="chip">免安裝</span><span class="chip">非官方</span></div>
      </div>
      <div class="cards" id="cards"></div>
      <canvas class="arena" id="arena"></canvas>
    </div>
    <img id="icon" alt="" />
    <script type="module" src="./og.ts"></script>
  </body>
</html>
