<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>分享圖產生器（開發用）</title>
    <style>
      html, body { margin: 0; background: #0b1117; font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; color: #f4efe4; }
      #og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(90% 120% at 15% 10%, #3a5f94 0%, #1d3157 55%, #121d36 100%); }
      #og .text { position: absolute; left: 64px; top: 70px; width: 600px; }
      #og h1 { margin: 0; font-size: 92px; font-weight: 900; letter-spacing: 4px; line-height: 1.05; color: #ffe08a; text-shadow: 0 5px 0 #7a4a08, 0 9px 0 #2a1802; }
      #og h1 small { display: block; font-size: 46px; letter-spacing: 18px; color: #fff; text-shadow: 0 4px 0 #1b2948; margin-top: 6px; }
      #og .tag { margin: 22px 0 0; font-size: 40px; font-weight: 800; color: #fff; }
      #og .sub { margin: 12px 0 0; font-size: 28px; color: #c7d1da; }
      #og .chips { display: flex; gap: 14px; margin-top: 26px; }
      #og .chip { padding: 9px 22px; border-radius: 30px; border: 2px solid #5a7ab0; font-size: 25px; font-weight: 700; background: rgba(0,0,0,.25); }
      #og .stage { position: absolute; right: 40px; top: 24px; width: 330px; height: 582px; border-radius: 20px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.6); border: 4px solid #0a0f14; background: #2d4f2a; }
      #og .stage canvas { position: absolute; left: 0; top: 0; }
      #og .cards { position: absolute; left: 64px; bottom: 44px; display: flex; gap: 14px; }
      #og .card { width: 104px; height: 130px; position: relative; border-radius: 14px; border: 3px solid #0d1426; overflow: hidden; box-shadow: inset 0 0 0 3px rgba(255,255,255,.38), 0 6px 0 rgba(0,0,0,.45); }
      #og .card.r-common { background: linear-gradient(#9cc0e6, #46698f); }
      #og .card.r-rare { background: linear-gradient(#ffc779, #c2651a); }
      #og .card.r-epic { background: linear-gradient(#df9cf7, #7f2fae); }
      #og .card.r-legendary { background: linear-gradient(#9ff3e6, #a861db); }
      #og .card img { position: absolute; left: 4%; top: 3%; width: 92%; height: 84%; object-fit: cover; object-position: 50% 20%; }
      #og .card .cost { position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: radial-gradient(circle at 35% 35%, #ffd2f6, #e04ad0 55%, #8a1f80); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; }
      #og .card .cost b { transform: rotate(45deg); font-size: 17px; font-weight: 900; text-shadow: 0 1px 1px #000; }
      #og .card .card-name { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: 15px; font-weight: 900; text-shadow: 0 0 3px #000, 0 1px 2px #000; }
      #og .card .fill, #og .card .card-glyph { display: none; }
      #icon { width: 180px; height: 180px; }
    </style>
  </head>
  <body>
    <div id="og">
      <div class="text">
        <h1>皇室戰爭<small>克隆</small></h1>
        <p class="tag">出牌派兵・過橋推塔</p>
        <p class="sub">三分鐘一局，手機點開就能玩</p>
        <div class="chips"><span class="chip">單人對電腦</span><span class="chip">免安裝</span><span class="chip">非官方</span></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="stage" id="stage"><canvas id="arena"></canvas><canvas id="arena-ui"></canvas></div>
    </div>
    <img id="icon" alt="" />
    <script type="module" src="./og.ts"></script>
  </body>
</html>
